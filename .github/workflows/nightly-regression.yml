name: Nightly Playwright Regression

on:
  schedule:
    # Runs daily at 22:00 UTC (05:00 the next day in Vietnam, UTC+7).
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to test
        required: true
        type: choice
        options:
          - qa
          - uat
          - stg
        default: qa
      browsers:
        description: Browser projects to run
        required: true
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit
        default: all

permissions:
  contents: read

concurrency:
  group: nightly-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    name: Regression (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        browser: ${{ (github.event_name == 'workflow_dispatch' && inputs.browsers != 'all') && fromJSON(format('["{0}"]', inputs.browsers)) || fromJSON('["chromium", "firefox", "webkit"]') }}

    env:
      # Scheduled runs default to QA. Manual runs can select QA, UAT, or Staging.
      ENV: ${{ inputs.environment || 'qa' }}
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser and OS dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Run regression suite
        run: npx playwright test --grep @regression --project=${{ matrix.browser }}

      - name: Upload Playwright report and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-regression-${{ env.ENV }}-${{ matrix.browser }}-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
